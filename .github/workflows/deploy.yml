name: Publiser oppskriftssiden

on:
  push:
    branches:
      - v5
  workflow_dispatch:

# Ingen rettigheter som standard; hver jobb får bare det den trenger.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Byggesteget kjører tredjepartskode (npm-pakker), så det får bare lesetilgang.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Hent repoet
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sett opp Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Mellomlagre avhengigheter
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Quartz-utvidelser
        run: npx quartz plugin install

      - name: Bygg nettsiden
        run: npx quartz build

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Bare publiseringssteget får skrivetilgang til Pages.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
