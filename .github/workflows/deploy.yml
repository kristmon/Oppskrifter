name: Publiser oppskriftssiden

on:
  push:
    branches:
      - v5
  workflow_dispatch:

# Ingen rettigheter som standard; hver jobb får bare det den trenger.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Byggesteget kjører tredjepartskode (npm-pakker), så det får bare lesetilgang.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Hent repoet
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Sett opp Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24

      - name: Mellomlagre avhengigheter
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Installer avhengigheter
        run: npm ci

      - name: Installer Quartz-utvidelser
        run: npx quartz plugin install

      - name: Bygg nettsiden
        run: npx quartz build

      - name: Klargjør GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Bare publiseringssteget får skrivetilgang til Pages.
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
